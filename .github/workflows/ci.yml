name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Validate TypeScript Types & Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://vaishnavamart.com
          NEXT_PUBLIC_DATA_MODE: mock
          PAYMENT_PROVIDER: mock
          NEXT_PUBLIC_RAZORPAY_KEY_ID: mock_razorpay_key
          RAZORPAY_KEY_SECRET: mock_razorpay_secret
          DEV_ADMIN_EMAIL: raskanfood@gmail.com
          DEV_ADMIN_PASSWORD: mock_test_password
